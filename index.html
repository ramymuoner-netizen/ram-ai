<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM Ai</title>
<link rel="manifest" href="data:application/json,{'name':'RAM Ai','short_name':'RAM','display':'standalone'}">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--p1:#8b5cf6;--p2:#ec4899;--bg:#0a0a14;--card:rgba(255,255,255,.06);--txt:#fff;--b:rgba(255,255,255,.1)}
[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--txt:#000;--b:rgba(0,0,0,.1)}
[data-theme="gold"]{--p1:#f59e0b;--p2:#ef4444}
[data-theme="cyber"]{--p1:#00ff88;--p2:#00d4ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden;transition:.3s}
.bg{position:fixed;inset:0;background:radial-gradient(800px at 15% 20%,var(--p1),transparent 60%),radial-gradient(700px at 85% 80%,var(--p2),transparent 60%);opacity:.25}
.app{position:relative;z-index:1;display:flex;width:100%;height:100vh}
.sidebar{width:300px;background:rgba(15,15,25,.9);backdrop-filter:blur(20px);border-left:1px solid var(--b);padding:16px;display:flex;flex-direction:column}
.logo{display:flex;gap:10px;align-items:center}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:12px;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 20px var(--p1)}
.themes{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.th{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.th.active{border-color:#fff;box-shadow:0 0 0 2px var(--p1)}
.btn{width:100%;padding:11px;border-radius:10px;border:0;font-weight:800;cursor:pointer;transition:.2s}
.btn-main{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 8px 20px var(--p1)}
.btn-ghost{background:var(--card);color:var(--txt);margin-top:6px;border:1px solid var(--b);font-size:12px}
.hist{flex:1;overflow:auto;margin-top:12px}
.hist-item{padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:5px;font-size:11px;color:#aaa;cursor:pointer}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px)}
.menu{display:none;padding:8px 12px;border-radius:8px;background:var(--card);border:0;color:var(--txt);font-size:18px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:85%;padding:14px 18px;border-radius:18px;line-height:1.7;font-size:14px;animation:pop .2s ease;position:relative}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.m.ai{align-self:flex-start;background:var(--card);border:1px solid var(--b);border-bottom-right-radius:6px}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-bottom-left-radius:6px}
.m img{max-width:200px;border-radius:10px;margin-top:8px}
.tools{display:flex;gap:6px;margin-top:8px}
.tool{font-size:10px;padding:4px 8px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid var(--b);cursor:pointer}
.inputArea{padding:12px;background:rgba(0,0,0,.2);border-top:1px solid var(--b)}
.quick{display:flex;gap:6px;margin-bottom:8px;overflow:auto}
.quick button{white-space:nowrap;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--b);color:var(--p1);font-size:11px;cursor:pointer}
.box{display:flex;gap:8px;background:var(--card);border:1px solid var(--b);border-radius:18px;padding:6px 10px;align-items:flex-end}
#inp{flex:1;background:transparent;border:0;color:var(--txt);outline:none;resize:none;max-height:100px;min-height:24px;padding:6px;font-size:14px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--b);color:var(--txt);cursor:pointer;display:grid;place-items:center;font-size:16px}
.icon.main{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0}
.ad{margin:10px 0;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,0,.15),rgba(255,165,0,.15));border:1px dashed #f59e0b;font-size:11px;text-align:center;color:#fbbf24}
@media(max-width:850px){.sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);z-index:30;transition:.3s}.sidebar.open{transform:translateX(0)}.menu{display:block}.m{max-width:92%}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}.overlay.show{display:block}
</style>
</head>
<body data-theme="dark">
<div class="bg"></div>
<div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="side">
<div class="logo"><div class="logo-icon">R</div><div><b>RAM Ai Ultimate</b><div style="font-size:10px;color:var(--p1)">تصميم + ذكاء + ربح 💰</div></div></div>

<div class="themes">
<div class="th active" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)" onclick="setTheme('dark',this)"></div>
<div class="th" style="background:#fff" onclick="setTheme('light',this)"></div>
<div class="th" style="background:linear-gradient(135deg,#f59e0b,#ef4444)" onclick="setTheme('gold',this)"></div>
<div class="th" style="background:linear-gradient(135deg,#00ff88,#00d4ff)" onclick="setTheme('cyber',this)"></div>
</div>

<button class="btn btn-main" id="newBtn">✨ جديد</button>
<div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-ghost" id="exportBtn">📄 PDF</button><button class="btn btn-ghost" id="clrBtn">🗑️</button></div>

<div class="hist" id="hList"></div>

<div class="ad" id="adBox" style="min-height:100px">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXXXXXX"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>

<div style="font-size:9px;color:#666;text-align:center;margin-top:8px">صنع <b style="color:var(--p1)">رامي منير حسن</b> 🇸🇩<br>PWA • Voice • Vision</div>
</aside>

<main class="chat">
<div class="header"><b>RAM Ai</b><div style="display:flex;gap:8px"><button class="icon" id="themeBtn">🌗</button><button class="menu" id="mn">☰</button></div></div>
<div id="msgs"></div>
<div class="inputArea">
<div class="quick">
<button onclick="quick('من صنعك؟')">🇸🇩 من صنعك؟</button>
<button onclick="quick('حلل الصورة')">🖼️ حلل صورة</button>
<button onclick="quick('فكرة مشروع')">💡 مشروع</button>
</div>
<div class="box">
<button class="icon" id="imgBtn">📎</button>
<button class="icon" id="micBtn">🎤</button>
<textarea id="inp" placeholder="اكتب، تحدث، أو أرفق صورة..." rows="1"></textarea>
<button class="icon main" id="sendBtn">➤</button>
</div>
<input type="file" id="fileInp" accept="image/*" hidden>
<div style="font-size:9px;color:#777;margin-top:6px">⚡ كاش + صوت + صور +  + PWA • صنع رامي منير حسن</div>
</div>
</main>
</div>

<script>
const msgs=document.getElementById('msgs'),inp=document.getElementById('inp'),side=document.getElementById('side'),overlay=document.getElementById('overlay');
document.getElementById('mn').onclick=()=>{side.classList.add('open');overlay.classList.add('show')};
overlay.onclick=()=>{side.classList.remove('open');overlay.classList.remove('show')};

function setTheme(t,el){
  document.body.setAttribute('data-theme',t);
  document.querySelectorAll('.th').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  localStorage.setItem('ram_theme',t);
}
let savedTheme=localStorage.getItem('ram_theme')||'dark';
document.body.setAttribute('data-theme',savedTheme);
document.getElementById('themeBtn').onclick=()=>{
  let cur=document.body.getAttribute('data-theme');
  setTheme(cur==='dark'?'light':'dark',null);
};

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';});

function addMsg(t,who,img){
  const d=document.createElement('div');
  d.className='m '+(who==='me'?'me':'ai');
  let html=t.replace(/\n/g,'<br>');
  if(img) html+=`<br><img src="${img}">`;
  html+=`<div style="display:flex;gap:6px;margin-top:8px"><span class="tool" onclick="speak('${t.replace(/'/g,"").slice(0,100)}')">🔊 صوت</span><span class="tool" onclick="navigator.clipboard.writeText('${t.replace(/'/g,"").slice(0,200)}')">📋 نسخ</span></div>`;
  d.innerHTML=html;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;

  // إعلان كل 5 رسائل (ربح)
  let c=parseInt(localStorage.getItem('msgCount')||'0')+1;
  localStorage.setItem('msgCount',c);
  if(c%5===0){
    const ad=document.createElement('div');
    ad.className='ad';
    ad.innerHTML='📢 إعلان - RAM Ai Pro<br>اشترك لإزالة الإعلانات - 2$ فقط<br><button style="margin-top:6px;padding:6px 12px;border-radius:20px;border:0;background:#000;color:#fbbf24">اشترك الآن</button>';
    msgs.appendChild(ad);
  }
  return d;
}

function saveHist(t){
  let h=JSON.parse(localStorage.getItem('ram_ult')||'[]');
  h.unshift(t);
  localStorage.setItem('ram_ult',JSON.stringify(h.slice(0,30)));
  renderHist();
}
function renderHist(){
  let h=JSON.parse(localStorage.getItem('ram_ult')||'[]');
  document.getElementById('hList').innerHTML=h.map(x=>`<div class="hist-item">${x.slice(0,30)}</div>`).join('');
}
renderHist();
window.quick=(t)=>{inp.value=t;ask();};

function isCreator(t){return ['من صنعك','صانعك','who made you'].some(k=>t.toLowerCase().includes(k));}

// صوت
function speak(text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.slice(0,200));
    u.lang='ar-SA';u.rate=1;
    speechSynthesis.speak(u);
  }
}

// ميكروفون
let rec;
document.getElementById('micBtn').onclick=()=>{
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){alert('المتصفح لا يدعم الصوت');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();rec.lang='ar-SA';
  rec.onstart=()=>{document.getElementById('micBtn').innerText='⏹️';};
  rec.onresult=(e)=>{inp.value=e.results[0][0].transcript;};
  rec.onend=()=>{document.getElementById('micBtn').innerText='🎤';ask();};
  rec.start();
};

// صور
let attachedImg=null;
document.getElementById('imgBtn').onclick=()=>document.getElementById('fileInp').click();
document.getElementById('fileInp').onchange=(e)=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{attachedImg=ev.target.result;addMsg('📎 صورة مرفقة','me',attachedImg);};
  r.readAsDataURL(f);
};

let cache=JSON.parse(localStorage.getItem('ram_ult_cache')||'{}');

async function ask(){
  const text=inp.value.trim();
  if(!text && !attachedImg) return;
  inp.value='';inp.style.height='auto';
  const imgToSend=attachedImg;
  attachedImg=null;

  addMsg(text||'حلل هذه الصورة','me',imgToSend);
  if(text) saveHist(text);

  if(isCreator(text)){
    addMsg('أنا <b>RAM Ai Ultimate</b> ✨<br>صنعني <b style="color:var(--p1)">المطور السبراني رامي منير حسن</b> 🇸🇩<br><br>💜 <br>🎤 صوت + 📎 صور<br>💰  AdMob<br>📱 PWA ','ai');
    return;
  }
  if(cache[text]){
    addMsg(cache[text],'ai');
    return;
  }

  const aiDiv=addMsg('💜 RAM يكتب...','ai');

  try{
    let prompt=text;
    if(imgToSend) prompt+=' [المستخدم أرفق صورة، حللها كأنك تراها]';
    const sys=encodeURIComponent('You are RAM Ai Ultimate, made by Rami Mounir Hassan. If asked who made you: صنعني المطور السبراني رامي منير حسن. Answer beautifully, helpful, Arabic.');
    const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${sys}&model=openai`);
    if(!res.ok) throw new Error();
    let ans=await res.text();
    cache[text]=ans;
    localStorage.setItem('ram_ult_cache',JSON.stringify(cache));
    aiDiv.innerHTML=ans.replace(/\n/g,'<br>')+`<br><div style="display:flex;gap:6px;margin-top:8px"><span class="tool" onclick="speak('${ans.replace(/'/g,"").slice(0,100)}')">🔊 صوت</span><span class="tool" onclick="navigator.clipboard.writeText('${ans.replace(/'/g,"").slice(0,200)}')">📋 نسخ</span></div>`;
  }catch(e){
    aiDiv.innerHTML='⚠️ النت ضعيف<br>أنا RAM Ai صنعني رامي منير حسن 🇸🇩';
  }
}

document.getElementById('sendBtn').onclick=ask;
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}};
document.getElementById('newBtn').onclick=()=>{msgs.innerHTML='';addMsg('أهلاً في النسخة الأسطورية ✨<br><br>🎨 ثيمات ألوان<br>🎤 تكلم بدل كتابة<br>📎 أرفق صور<br> 🇸🇩','ai');};
document.getElementById('clrBtn').onclick=()=>{if(confirm('مسح؟')){localStorage.removeItem('ram_ult');localStorage.removeItem('ram_ult_cache');renderHist();msgs.innerHTML='';}};
document.getElementById('exportBtn').onclick=()=>{
  let h=JSON.parse(localStorage.getItem('ram_ult')||'[]').join('\n');
  let blob=new Blob([h],{type:'text/plain'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RAM_Ai_Chat.txt';a.click();
};

// PWA تسجيل
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('data:text/javascript,console.log("RAM Ai PWA")');
}

addMsg('مرحباً كيف اساعدك 🚀<br><br>دي <b>RAM Ai  🇸🇩','ai');
</script>
</body>
</html>
