<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAM Ai Ultimate | رامي منير حسن</title>
<meta name="theme-color" content="#8b5cf6">
<link rel="manifest" href='data:application/manifest+json,[STRIPPED] Ai","short_name":"RAM","display":"standalone","background_color":"#0a0a14","theme_color":"#8b5cf6","start_url":"."}'>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--p1:#8b5cf6;--p2:#ec4899;--bg:#0a0a14;--bg2:#12121e;--card:rgba(255,255,255,.06);--txt:#fff;--muted:#9ca3af;--b:rgba(255,255,255,.1)}
[data-theme="light"]{--bg:#f6f6f8;--bg2:#fff;--card:#fff;--txt:#111;--muted:#666;--b:rgba(0,0,0,.08)}
[data-theme="gold"]{--p1:#f59e0b;--p2:#ef4444}
[data-theme="cyber"]{--p1:#00ff88;--p2:#00d4ff}
[data-theme="ocean"]{--p1:#0ea5e9;--p2:#6366f1}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--txt);height:100dvh;display:flex;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(900px at 10% 15%,var(--p1),transparent 60%),radial-gradient(800px at 90% 85%,var(--p2),transparent 60%);opacity:.22}
.app{position:relative;z-index:1;display:flex;width:100%;height:100dvh}
.sidebar{width:310px;background:var(--bg2);border-left:1px solid var(--b);padding:18px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;gap:12px;align-items:center}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff}
.themes{display:flex;gap:8px}.th{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}.th.active{border-color:#fff;box-shadow:0 0 0 2px var(--p1)}
.btn{width:100%;padding:12px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.btn-main{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-row{display:flex;gap:8px}.btn-ghost{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--b);font-size:12px;padding:10px}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}.hist-item{padding:10px;background:var(--card);border-radius:10px;font-size:12px;color:var(--muted);cursor:pointer}
.settings{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:12px}.settings select{width:100%;padding:8px;border-radius:8px;background:var(--bg2);border:1px solid var(--b);color:var(--txt);margin:6px 0 10px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}
.menu{display:none;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--b);color:var(--txt)}
#msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.m{max-width:82%;padding:14px 16px;border-radius:18px;line-height:1.8;font-size:14px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.m.ai{align-self:flex-start;background:var(--card);border:1px solid var(--b)}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.m img{max-width:240px;border-radius:12px;margin-top:8px}
.tools{display:flex;gap:6px;margin-top:10px}.tool{font-size:11px;padding:5px 10px;border-radius:20px;background:rgba(0,0,0,.15);border:1px solid var(--b);cursor:pointer}
.inputArea{padding:14px;background:var(--bg2);border-top:1px solid var(--b)}
.quick{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.quick button{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--b);color:var(--p1);font-size:12px;font-weight:700;cursor:pointer}
.box{display:flex;gap:8px;background:var(--card);border:1px solid var(--b);border-radius:20px;padding:6px;align-items:flex-end}
#inp{flex:1;background:transparent;border:0;color:var(--txt);outline:none;resize:none;max-height:120px;padding:8px;font-size:14px}
.icon{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--b);color:var(--txt);cursor:pointer;display:grid;place-items:center}
.icon.main{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;width:44px;height:44px}
.icon.rec{background:#ef4444!important;color:#fff!important}
.preview{display:none;align-items:center;gap:8px;margin-bottom:8px;background:var(--card);padding:8px;border-radius:12px}.preview.show{display:flex}.preview img{width:40px;height:40px;object-fit:cover;border-radius:8px}
@media(max-width:850px){.sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(105%);z-index:30;transition:.3s}.sidebar.open{transform:translateX(0)}.menu{display:block}.m{max-width:92%}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}.overlay.show{display:block}
</style>
</head>
<body data-theme="dark">
<div class="bg"></div><div class="overlay" id="overlay"></div>
<div class="app">
<aside class="sidebar" id="side">
<div class="logo"><div class="logo-icon">R</div><div><b>RAM Ai Ultimate</b><br><small style="color:var(--p1)">تصميم + ذكاء ⚡</small></div></div>
<div class="themes">
<div class="th active" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)" onclick="setTheme('dark',this)"></div>
<div class="th" style="background:#fff" onclick="setTheme('light',this)"></div>
<div class="th" style="background:linear-gradient(135deg,#f59e0b,#ef4444)" onclick="setTheme('gold',this)"></div>
<div class="th" style="background:linear-gradient(135deg,#00ff88,#00d4ff)" onclick="setTheme('cyber',this)"></div>
<div class="th" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)" onclick="setTheme('ocean',this)"></div>
</div>
<button class="btn btn-main" id="newBtn">✨ محادثة جديدة</button>
<div class="btn-row"><button class="btn btn-ghost" id="exportBtn">📄 تصدير</button><button class="btn btn-ghost" id="clrBtn">🗑️ مسح</button></div>
<div class="settings">
<label style="font-size:11px">🧠 النموذج</label>
<select id="modelSel"><option value="openai">OpenAI</option><option value="turbo">Turbo</option></select>
<label style="font-size:11px">🎨 الأسلوب</label>
<select id="styleSel"><option value="helpful">مساعد</option><option value="short">مختصر</option><option value="code">مبرمج</option><option value="sudanese">سوداني عامي</option></select>
</div>
<div class="hist"><div style="font-size:11px;color:var(--muted)">🕐 السجل</div><div id="hList"></div></div>
<div style="font-size:10px;color:var(--muted);text-align:center">صنع <b style="color:var(--p1)">رامي منير حسن</b> 🇸🇩</div>
</aside>
<main class="chat">
<div class="header"><b>RAM Ai</b><div style="display:flex;gap:8px"><button class="icon" id="themeBtn">🌗</button><button class="menu" id="mn">☰</button></div></div>
<div id="msgs"></div>
<div class="inputArea">
<div class="preview" id="preview"><img id="prevImg"><span style="flex:1;font-size:12px">صورة جاهزة</span><button onclick="clearImg()" style="background:#ef4444;color:#fff;border:0;width:24px;height:24px;border-radius:50%">✕</button></div>
<div class="quick"><button onclick="quick('من صنعك؟')">🇸🇩 من صنعك؟</button><button onclick="quick('فكرة مشروع مربح')">💡 مشروع</button><button onclick="quick('اكتب كود بايثون')">💻 كود</button></div>
<div class="box"><button class="icon" id="imgBtn">📎</button><button class="icon" id="micBtn">🎤</button><textarea id="inp" placeholder="اكتب أو تكلم..." rows="1"></textarea><button class="icon main" id="sendBtn">➤</button></div>
<input type="file" id="fileInp" accept="image/*" hidden>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id),msgs=$('msgs'),inp=$('inp'),side=$('side'),overlay=$('overlay');
$('mn').onclick=()=>{side.classList.add('open');overlay.classList.add('show')};overlay.onclick=()=>{side.classList.remove('open');overlay.classList.remove('show')};
function setTheme(t,el){document.body.setAttribute('data-theme',t);document.querySelectorAll('.th').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');localStorage.setItem('ram_theme',t)}
setTheme(localStorage.getItem('ram_theme')||'dark',document.querySelector('.th.active'));
$('themeBtn').onclick=()=>setTheme(document.body.getAttribute('data-theme')==='dark'?'light':'dark',null);
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmt(t){return esc(t).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.slice(0,300));u.lang='ar-SA';speechSynthesis.speak(u)}}
function copyText(t){navigator.clipboard.writeText(t)}
function addMsg(t,who,img){const d=document.createElement('div');d.className='m '+(who==='me'?'me':'ai');let h=fmt(t);if(img)h+=`<img src="${img}">`;if(who==='ai')h+=`<div class="tools"><span class="tool" onclick="speak(this.closest('.m').innerText)">🔊 صوت</span><span class="tool" onclick="copyText(this.closest('.m').innerText)">📋 نسخ</span></div>`;d.innerHTML=h;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function saveHist(t){let h=JSON.parse(localStorage.getItem('ram_hist')||'[]');h.unshift(t);localStorage.setItem('ram_hist',JSON.stringify(h.slice(0,40)));renderHist()}
function renderHist(){let h=JSON.parse(localStorage.getItem('ram_hist')||'[]');$('hList').innerHTML=h.map((x,i)=>`<div class="hist-item" onclick="loadHist(${i})">${esc(x.slice(0,35))}</div>`).join('')}
window.loadHist=i=>{inp.value=JSON.parse(localStorage.getItem('ram_hist')||'[]')[i];ask()};
renderHist();window.quick=t=>{inp.value=t;ask()};
function isCreator(t){return ['من صنعك','صانعك','who made you'].some(k=>t.toLowerCase().includes(k))}
let rec,isRec=false;$('micBtn').onclick=()=>{if(isRec){rec.stop();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('لا يدعم');rec=new SR();rec.lang='ar-SA';rec.onstart=()=>{isRec=true;$('micBtn').classList.add('rec')};rec.onresult=e=>inp.value=e.results[0][0].transcript;rec.onend=()=>{isRec=false;$('micBtn').classList.remove('rec');if(inp.value.trim())ask()};rec.start()};
let attachedImg=null;$('imgBtn').onclick=()=>$('fileInp').click();$('fileInp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{attachedImg=ev.target.result;$('prevImg').src=attachedImg;$('preview').classList.add('show')};r.readAsDataURL(f)};
window.clearImg=()=>{attachedImg=null;$('preview').classList.remove('show')};
let cache=JSON.parse(localStorage.getItem('ram_cache')||'{}');
async function ask(){const text=inp.value.trim();if(!text&&!attachedImg)return;inp.value='';const img=attachedImg;attachedImg=null;$('preview').classList.remove('show');addMsg(text||'حلل الصورة','me',img);if(text)saveHist(text);if(isCreator(text)){addMsg('أنا **RAM Ai Ultimate** ✨\nصنعني **رامي منير حسن** 🇸🇩','ai');return}const key=text+$('modelSel').value+$('styleSel').value;if(cache[key]&&!img){addMsg(cache[key],'ai');return}const aiDiv=addMsg('...','ai');try{let prompt=text||'حلل الصورة';if(img)prompt+=' [حلل الصورة]';const styles={helpful:'You are RAM Ai, answer in Arabic.',short:'Short Arabic.',code:'Expert programmer, Arabic.',sudanese:'رد بالعامية السودانية'};const sys=encodeURIComponent((styles[$('styleSel').value]||styles.helpful)+' If asked who made you: صنعني رامي منير حسن');const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${sys}&model=${$('modelSel').value}`);let ans=await res.text();cache[key]=ans;localStorage.setItem('ram_cache',JSON.stringify(cache));aiDiv.innerHTML=fmt(ans)+`<div class="tools"><span class="tool" onclick="speak(this.closest('.m').innerText)">🔊 صوت</span><span class="tool" onclick="copyText(this.closest('.m').innerText)">📋 نسخ</span></div>`}catch(e){aiDiv.innerHTML='⚠️ النت ضعيف - رامي منير حسن 🇸🇩'}}
$('sendBtn').onclick=ask;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
$('newBtn').onclick=()=>{msgs.innerHTML='';addMsg('أهلاً في **RAM Ai Ultimate** 🚀\nجرب: من صنعك؟','ai')};
$('clrBtn').onclick=()=>{localStorage.removeItem('ram_hist');localStorage.removeItem('ram_cache');renderHist();msgs.innerHTML=''};
$('exportBtn').onclick=()=>{let h=JSON.parse(localStorage.getItem('ram_hist')||'[]').join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/plain'}));a.download='RAM_Ai.txt';a.click()};
addMsg('مرحباً! أنا **RAM Ai Ultimate** 🚀\nصنعني **رامي منير حسن** 🇸🇩\nاسألني: من صنعك؟','ai');
</script>
</body>
</html>
